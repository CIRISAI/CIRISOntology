name: spatiotemporal-gray-bridge-v2

on:
  pull_request:
    paths:
      - 'scratchpad/TRANSITION_MAP/SPATIOTEMPORAL_GRAY_BRIDGE_V2_PREREG.md'
      - 'scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_v2.py'
      - 'scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_v2_aggregate.py'
      - '.github/workflows/spatiotemporal-gray-bridge-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice:
    strategy:
      fail-fast: false
      matrix:
        N: [32, 64, 128, 256]
        sigma: ['0.02', '0.05', '0.1']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Execute frozen bridge slice
        run: |
          cd scratchpad/TRANSITION_MAP
          python spatiotemporal_gray_bridge_v2.py --N ${{ matrix.N }} --sigma ${{ matrix.sigma }} | tee bridge_v2_N${{ matrix.N }}_s${{ matrix.sigma }}.txt
      - name: Gate implementation slice
        run: |
          python - <<'PY'
          import json, glob
          p=glob.glob('scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_v2_N*_s*.json')
          assert len(p)==1,p
          r=json.load(open(p[0])); g=r['gates']
          assert g['V1_common_dark_worst'] < 1e-8, g
          assert g['V2_cov_rel_frob_worst'] < 0.15, g
          assert g['V3_integral_error'] < 1e-10, g
          assert g['V4_zero_noise_dark_worst'] < 1e-8, g
          print('V1-V4 slice gates PASS.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-v2-N${{ matrix.N }}-s${{ matrix.sigma }}
          path: |
            scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_v2_N${{ matrix.N }}_s${{ matrix.sigma }}.json
            scratchpad/TRANSITION_MAP/bridge_v2_N${{ matrix.N }}_s${{ matrix.sigma }}.txt
          if-no-files-found: error

  aggregate:
    needs: slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: bridge-v2-*
          path: bridge-v2-artifacts
      - name: Aggregate frozen scientific stakes
        run: |
          cd scratchpad/TRANSITION_MAP
          python spatiotemporal_gray_bridge_v2_aggregate.py ../../bridge-v2-artifacts --out spatiotemporal_gray_bridge_v2_results.json | tee spatiotemporal_gray_bridge_v2_summary.txt
      - name: Gate aggregate implementation only
        run: |
          python - <<'PY'
          import json
          r=json.load(open('scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_v2_results.json'))
          g=r['gates']
          assert g['V1_common_dark_worst'] < 1e-8, g
          assert g['V2_cov_rel_frob_worst'] < 0.15, g
          assert g['V3_integral_error'] < 1e-10, g
          assert g['V4_zero_noise_dark_worst'] < 1e-8, g
          print('V1-V4 PASS. P1-P7 remain scientific outcomes.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spatiotemporal-gray-bridge-v2-results
          path: |
            scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_v2_results.json
            scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_v2_summary.txt
          if-no-files-found: error
