name: spatiotemporal-gray-bridge-pilot

on:
  pull_request:
    paths:
      - 'scratchpad/TRANSITION_MAP/SPATIOTEMPORAL_GRAY_BRIDGE_PREREG.md'
      - 'scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_pilot.py'
      - '.github/workflows/spatiotemporal-gray-bridge-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --upgrade pip numpy
      - name: Execute frozen spatiotemporal bridge pilot
        run: |
          cd scratchpad/TRANSITION_MAP
          python spatiotemporal_gray_bridge_pilot.py | tee spatiotemporal_gray_bridge_pilot_summary.txt
      - name: Gate pilot implementation only
        run: |
          python - <<'PY'
          import json
          r=json.load(open('scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_pilot_results.json'))
          g=r['gates']
          assert g['B1_common_dark_worst'] < 1e-8, g
          assert g['B3_cov_rel_frob_worst'] < 0.15, g
          print('Pilot B1/B3 implementation gates PASS. Full preregistered P1-P4 remain closed.')
          PY
      - name: Upload pilot result
        uses: actions/upload-artifact@v4
        with:
          name: spatiotemporal-gray-bridge-pilot-results
          path: |
            scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_pilot_results.json
            scratchpad/TRANSITION_MAP/spatiotemporal_gray_bridge_pilot_summary.txt
          if-no-files-found: error
