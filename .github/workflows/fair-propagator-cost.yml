name: fair-propagator-cost

on:
  pull_request:
    paths:
      - 'scratchpad/TRANSITION_MAP/FAIR_PROPAGATOR_COST_PREREG.md'
      - 'scratchpad/TRANSITION_MAP/fair_propagator_cost.py'
      - '.github/workflows/fair-propagator-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fair-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Execute frozen fair-cost comparison
        run: |
          cd scratchpad/TRANSITION_MAP
          python fair_propagator_cost.py | tee fair_propagator_cost_summary.txt
      - name: Gate FPC1-FPC3
        run: |
          python - <<'PY'
          import json
          r=json.load(open('scratchpad/TRANSITION_MAP/fair_propagator_cost_results.json'))
          g=r['gates']
          assert g['FPC1_full_m_le4'], g
          assert g['FPC2_class_m_converged'], g
          assert g['FPC3_relabel_max_error_mismatch'] < 1e-10, g
          print('FPC1-FPC3 PASS. P1-P4 remain scientific outcomes.')
          PY
      - name: Upload fair-cost result
        uses: actions/upload-artifact@v4
        with:
          name: fair-propagator-cost-results
          path: |
            scratchpad/TRANSITION_MAP/fair_propagator_cost_results.json
            scratchpad/TRANSITION_MAP/fair_propagator_cost_summary.txt
          if-no-files-found: error
