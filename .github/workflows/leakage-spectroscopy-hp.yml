name: leakage-spectroscopy-hp

on:
  pull_request:
    paths:
      - 'scratchpad/TRANSITION_MAP/LEAKAGE_SPECTROSCOPY_HP_PREREG.md'
      - 'scratchpad/TRANSITION_MAP/leakage_spectroscopy_hp.py'
      - '.github/workflows/leakage-spectroscopy-hp.yml'
      - 'scratchpad/TRANSITION_MAP/dark_state_k23.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hp-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Execute frozen high-precision audit
        run: |
          cd scratchpad/TRANSITION_MAP
          python leakage_spectroscopy_hp.py | tee leakage_spectroscopy_hp_summary.txt
      - name: Report frozen stakes without rewriting original gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('scratchpad/TRANSITION_MAP/leakage_spectroscopy_hp_results.json'))
          print(json.dumps(r['stakes'], indent=2))
          PY
      - name: Upload high-precision result
        uses: actions/upload-artifact@v4
        with:
          name: leakage-spectroscopy-hp-results
          path: |
            scratchpad/TRANSITION_MAP/leakage_spectroscopy_hp_results.json
            scratchpad/TRANSITION_MAP/leakage_spectroscopy_hp_summary.txt
          if-no-files-found: error
