name: dynamic-gray-algebra

on:
  pull_request:
    paths:
      - 'scratchpad/TRANSITION_MAP/DYNAMIC_GRAY_ALGEBRA_PREREG.md'
      - 'scratchpad/TRANSITION_MAP/dynamic_gray_algebra.py'
      - '.github/workflows/dynamic-gray-algebra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --upgrade pip numpy
      - name: Execute frozen dynamic gray-algebra screen
        run: |
          cd scratchpad/TRANSITION_MAP
          python dynamic_gray_algebra.py | tee dynamic_gray_algebra_summary.txt
      - name: Gate exact structural stakes
        run: |
          python - <<'PY'
          import json
          r=json.load(open('scratchpad/TRANSITION_MAP/dynamic_gray_algebra_results.json'))
          g=r['gates']
          assert g['D1'], ('D1 controls',g)
          assert g['D2'], ('D2 rank-1 generic counterexample',g)
          assert g['D3'], ('D3 local bath extensive rank',g)
          for row in r['rows']:
              cb=row['class_basis_check']
              assert cb['generator_invariance_residual'] < 1e-10
              assert cb['bright_containment_residual'] < 1e-10
          print('D1-D3 and class-basis invariance PASS. D4 numerical closure mismatches are reported, not CI-failed, per prereg conditioning rule.')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-gray-algebra-results
          path: |
            scratchpad/TRANSITION_MAP/dynamic_gray_algebra_results.json
            scratchpad/TRANSITION_MAP/dynamic_gray_algebra_summary.txt
          if-no-files-found: error
