name: dark-state-k23

on:
  pull_request:
    paths:
      - 'scratchpad/TRANSITION_MAP/DARK_STATE_K23_PREREG.md'
      - 'scratchpad/TRANSITION_MAP/dark_state_k23.py'
      - '.github/workflows/dark-state-k23.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k23:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Execute preregistered K2.3 analysis
        run: |
          cd scratchpad/TRANSITION_MAP
          python dark_state_k23.py | tee dark_state_k23_summary.txt
      - name: Gate O1-O3 and Lindblad convention
        run: |
          python - <<'PY'
          import json
          p='scratchpad/TRANSITION_MAP/dark_state_k23_results.json'
          r=json.load(open(p))
          for arm,a in r['arms'].items():
            for pair,o in a['pairs'].items():
              assert o['lindblad_crosscheck']['max_abs_error'] < 1e-9, (arm,pair,'Lindblad dye',o['lindblad_crosscheck']['max_abs_error'])
              for ks,k in o['kappas'].items():
                # O1 exact protection.
                z=k['rows'][0]
                assert z['s'] == 0.0 and z['Gamma'] < 1e-10, (arm,pair,ks,'O1',z['Gamma'])
                # O2 weak quadratic opening.
                sl=k['weak_log_slope']
                assert sl is not None and abs(sl-2.0) <= 0.01, (arm,pair,ks,'O2',sl)
                # O3 coefficient prediction.
                sc=k['coefficient_score']
                assert sc['n'] >= 5 and sc['median_abs_frac_error'] <= 0.01, (arm,pair,ks,'O3',sc)
          print('K2.3 O1-O3 PASS and Lindblad sink convention cross-check PASS.')
          PY
      - name: Upload K2.3 result
        uses: actions/upload-artifact@v4
        with:
          name: dark-state-k23-results
          path: |
            scratchpad/TRANSITION_MAP/dark_state_k23_results.json
            scratchpad/TRANSITION_MAP/dark_state_k23_summary.txt
          if-no-files-found: error
