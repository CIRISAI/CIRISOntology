name: verify

# The epistemic-hygiene gate. Layered on purpose: each layer alone is
# defeatable, and the layers catch different failures.
#
#   1. textual  — cheap, fails fast, catches the obvious. NOT trusted alone:
#                 it cannot see a gap introduced by a tactic, and a naive
#                 keyword search false-positives on prose that merely
#                 *describes* the rule (this repository's own docs do).
#   2. build    — Lean's own warnings, escalated to errors with --wfail.
#                 NOT trusted alone: `#guard_msgs` swallows the sorry warning.
#   3. semantic — ask the proof assistant what each theorem actually depends
#                 on. This is the layer that cannot be talked around, and it
#                 is the one that decides.
#
# See epistemology.md §4-5.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-wasm:
    name: CIRISHolon Rust/WASM
    runs-on: ubuntu-latest
    # HANG PROTECTION. GitHub's default job timeout is 6 HOURS, and on
    # 2026-08-25 a debug-mode test suite hung on that default and took the whole
    # project's pipeline with it. A job that cannot finish in 40 minutes is
    # broken, not slow: fail it while a human still has the afternoon.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sim_engine
    steps:
      - uses: actions/checkout@v5

      - name: Install WebAssembly targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Core, bridge, and portability gates
        run: ./ci-gates.sh

      - name: Holon tests and all-target compilation
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          # RELEASE, NOT DEBUG — the cause of the 2026-08-25 pipeline hang.
          # ciris-sim-core's suite is 40s in release and does not finish in
          # DEBUG at all (measured: >10 min with no output, on a machine that
          # runs it in 37.6s optimised). The fracture/impact work made the
          # unoptimised path effectively unbounded. ci-gates.sh already runs
          # this suite `--release`, so the debug invocation was both the slow
          # one and the redundant one.
          #
          # LOG RECOVERY. A killed step shows nothing useful when cargo buffers
          # per-binary, so every gate runs under its OWN timeout, tees to a log,
          # and prints the tail on failure. A hang now reports WHICH command
          # hung and what it had said, instead of a silent six-hour burn.
          # NOTE the explicit `set +e`: GitHub runs `run:` under `bash -e`, so
          # without it the pipeline's failure exits the script BEFORE the
          # handler below prints anything — the -e default silently defeats the
          # log recovery this function exists to provide.
          gate() {
            label="$1"; shift
            echo "::group::$label"
            set +e
            timeout --signal=TERM --kill-after=30s 600 "$@" 2>&1 | tee "/tmp/gate-$label.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                echo "::error::$label TIMED OUT after 600s (rc=$rc) - treat as a hang, not a slow machine"
              else
                echo "::error::$label failed (rc=$rc)"
              fi
              echo "--- last 60 lines of $label ---"
              tail -60 "/tmp/gate-$label.log" || true
              exit "$rc"
            fi
          }
          gate core-tests    cargo test -p ciris-sim-core --features alloc --release
          gate sandbox-tests cargo test -p holon-sandbox --release
          gate all-targets   cargo check --workspace --all-targets --features alloc

      - name: Zero-import component build and validation
        run: |
          cargo test --manifest-path crates/ciris-sim-component/Cargo.toml --all-targets
          cargo build --release --target wasm32-unknown-unknown \
            --manifest-path crates/ciris-sim-component/Cargo.toml
          mkdir -p crates/ciris-sim-component/dist
          cargo run --release --manifest-path crates/ciris-sim-component/Cargo.toml \
            --example lift -- \
            crates/ciris-sim-component/target/wasm32-unknown-unknown/release/ciris_sim_component.wasm \
            crates/ciris-sim-component/dist/ciris_sim_component.wasm

      - name: Analytic and Rapier comparison tests
        run: cargo test --manifest-path crates/engine-compare/Cargo.toml --bins

  verify:
    runs-on: ubuntu-latest
    # Lean + Mathlib is genuinely slow to build; 60 is generous against a
    # measured ~25 minutes, and still 6x tighter than the default.
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v5

      # --- Layer 1: textual guards -------------------------------------------
      # Matched against USE patterns, never the bare word, so documentation
      # that discusses the rule does not fail the build. This precision is the
      # point: a gate that cries wolf gets switched off.
      #
      # 2026-07-25: the `admit` arm did NOT follow that rule — it matched the
      # bare word, and duly fired on a Lean docstring containing the English
      # sentence "bits admit — all three always agree". The gate cried wolf on
      # prose in exactly the way the comment above says it must not, and
      # exactly as epistemology.md §4 predicts for naive keyword gates. Fixed
      # by giving `admit` the same use-position treatment as `sorry`. The gate
      # still catches `:= admit`, `by admit`, `exact admit` and a bare-line
      # `admit`, which are the only ways the tactic can be invoked — verified
      # in both directions (prose clean, all four use forms caught) before
      # this change was committed.
      - name: No admitted gaps in code position
        run: |
          hits="$(find CIRISOntology Main.lean Audit -name '*.lean' -print0 2>/dev/null \
            | xargs -0 grep -nE ':=[[:space:]]*(sorry|admit)\b|\b(by|exact)[[:space:]]+(sorry|admit)\b|^[[:space:]]*(sorry|admit)\b|\bmkSorry\b' || true)"
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::admitted gap in code"; exit 1; fi

      - name: No axioms minted in this repository
        run: |
          hits="$(find CIRISOntology Main.lean Audit -name '*.lean' -print0 2>/dev/null \
            | xargs -0 grep -nE '^[[:space:]]*((@\[[^]]*\]|private|protected|noncomputable|unsafe)[[:space:]]+)*axiom[[:space:]]+' || true)"
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::axiom declared"; exit 1; fi

      # --- Layer 2: build, warnings are errors -------------------------------
      - name: Build (warnings fail the build)
        uses: leanprover/lean-action@v1
        with:
          build: true
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
          build-args: "--wfail"

      # --- Layer 3: the semantic audit — the gate that decides ---------------
      # Elaborating this file IS the check: no published theorem may depend on
      # the admitted-gap axiom or on anything outside the standard three, the
      # dependency sets are pinned in both directions, every claim must carry a
      # falsifier, and the gates advertised as machine-checked must be exactly
      # those actually enforced.
      - name: Axiom and stance audit
        run: lake env lean Audit/AxiomAudit.lean

      # The published page must be generatable from the source of truth. If this
      # fails, the site would have gone stale against the repository.
      - name: Site generates from the Lean source
        run: |
          lake exe report site
          test -s site/index.html
          test -s site/process.html
          test -s site/pursuits.html
          test -s site/values.html
          test -s site/img/triad.svg
          test -s site/img/status.svg
